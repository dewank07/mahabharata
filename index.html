<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Decevia — Social deduction for 5 to 18 players</title>
    <meta
      name="description"
      content="A free hidden-roles party game for 5 to 18 people in the same room, played on your phones. Most of you are good; a few are secretly not. No download and no account — just a four-letter code."
    />
    <link rel="canonical" href="https://www.decevia.space/" />
    <meta name="theme-color" content="#131110" />
    <meta name="color-scheme" content="dark" />

    <!-- The tab. SVG for anything modern; the PNG is the fallback, and the
         180px one is what iOS puts on a home screen. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Sharing. og:image must be an absolute URL — relative paths are ignored
         by every crawler that matters. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Decevia" />
    <meta property="og:title" content="Decevia — Where Friends Become Foes" />
    <meta
      property="og:description"
      content="A hidden-roles party game for 5 to 18 people. Five missions decide it, and some of the group is lying. Free to play in the browser."
    />
    <meta property="og:url" content="https://www.decevia.space/" />
    <meta property="og:image" content="https://www.decevia.space/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Decevia — where friends become foes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Decevia — Where Friends Become Foes" />
    <meta
      name="twitter:description"
      content="A hidden-roles party game for 5 to 18 people. Five missions decide it, and some of the group is lying."
    />
    <meta name="twitter:image" content="https://www.decevia.space/og.png" />
    <!-- Fonts live here, not in an @import: Vite concatenates styles.css and
         seal.css into one file, so seal.css's @import landed mid-bundle and was
         dropped in a production build — taking EB Garamond and Manrope, the
         voice and every label of the Council Seal, with it. Self-host later.

         Three families, and only three: Cinzel for display, Manrope for
         everything you have to read, EB Garamond for the flavour lines. Inter
         and Plus Jakarta Sans were dropped along with the pre-Verdict
         stylesheet that was the only thing using them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
    />

    <!-- What the app is, for the crawlers that read it. Kept minimal and true:
         no aggregateRating, no fake offers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Decevia",
        "url": "https://www.decevia.space/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any modern browser",
        "description": "A free hidden-roles party game for 5 to 18 people. Start a game, share a four-letter code, and work out who in the group is lying.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR",
          "description": "Free to play. An optional paid plan adds extra roles, three add-ons and four more settings."
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
